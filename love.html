<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tỏ tình</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffdde1, #ee9ca7);
            font-family: Arial;
            overflow: hidden;
        }

        .box {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 8vw;
            max-font-size: 40px;
            text-shadow: 0 0 10px black;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #yes {
            background: #4CAF50;
            color: white;
        }

        #no {
            background: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Yêu anh không?</h1>
        <button id="yes">Có 💖</button>
        <button id="no">Không 💔</button>
    </div>

    <!-- POPUP -->
    <div id="popup" style="
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
">
        <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        text-align:center;
        width:300px;
    ">
            <h2>Nhập lời nhắn</h2>
            <input id="input" type="text" style="padding:10px;width:90%;">
            <br><br>
            <button onclick="closePopup()">Gửi</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("no");
        const yesBtn = document.getElementById("yes");
        const popup = document.getElementById("popup");
        const input = document.getElementById("input");

        // ======================
        // NÚT "KHÔNG" CHẠY TRỐN
        // ======================
        noBtn.addEventListener("mouseover", move);
        noBtn.addEventListener("touchstart", move); // mobile

        function swapButtons() {

            const box = document.querySelector(".box");
            const yes = document.getElementById("yes");
            const no = document.getElementById("no");

            // đổi vị trí trong DOM
            box.insertBefore(yes, no);
        }

        function move() {

            swapButtons();

            const padding = 80;

            const x = Math.random() * (window.innerWidth - padding);
            const y = Math.random() * (window.innerHeight - padding);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        // ======================
        // CLICK "CÓ"
        // ======================
        yesBtn.onclick = function () {
            popup.style.display = "flex";

            // auto chữ cố định
            input.value = "";
        };

        // ======================
        // CHẶN NHẬP + ÉP TEXT
        // ======================
        const message = "Tớ cũng yêu cậu 💖";
        let words = message.split(" ");
        let index = 0;

        input.addEventListener("input", () => {

            if (index >= words.length) return;

            let current = words.slice(0, index + 1).join(" ");

            input.value = current;

            index++;
        });

        // ======================
        // ĐÓNG POPUP
        // ======================
        function closePopup() {
            window.location.href = "final.html";
        }
    </script>

</body>

</html>
